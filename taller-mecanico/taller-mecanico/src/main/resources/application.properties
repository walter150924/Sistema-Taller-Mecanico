spring.application.name=taller-mecanico
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.datasource.url=jdbc:sqlite:taller.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.com.taller.mecanico=INFO
logging.level.org.hibernate.SQL=WARN

app.seeder.enabled=true

app.empresa.razon-social=SERVICIOS AUTOMOTRICES EL PISTON S.A.C.
app.empresa.nombre-comercial=Taller El Piston
app.empresa.ruc=20601234567
app.empresa.direccion=Av. Circunvalacion 845, Juliaca - Puno
app.empresa.telefono=(051) 32-1234
app.empresa.email=contacto@tallerelpiston.pe
